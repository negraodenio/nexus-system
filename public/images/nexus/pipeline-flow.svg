<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" fill="none">
  <rect width="1200" height="200" fill="#0A0A0F"/>
  <defs>
    <linearGradient id="flow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  <!-- Flow line -->
  <line x1="100" y1="100" x2="1100" y2="100" stroke="url(#flow)" stroke-width="1"/>
  <!-- Steps -->
  <g font-family="monospace" font-weight="bold">
    <!-- Record -->
    <circle cx="150" cy="100" r="24" stroke="#10b981" stroke-width="1.5" fill="none" opacity="0.6"/>
    <circle cx="150" cy="100" r="6" fill="#ef4444" opacity="0.8"/>
    <text x="150" y="150" text-anchor="middle" fill="#10b981" font-size="10" opacity="0.8">RECORD</text>
    <!-- Understand -->
    <circle cx="350" cy="100" r="24" stroke="#10b981" stroke-width="1.5" fill="none" opacity="0.6"/>
    <path d="M342,92 L358,108 M358,92 L342,108" stroke="#10b981" stroke-width="1.5" opacity="0.6"/>
    <text x="350" y="150" text-anchor="middle" fill="#10b981" font-size="10" opacity="0.8">UNDERSTAND</text>
    <!-- Create -->
    <circle cx="550" cy="100" r="24" stroke="#10b981" stroke-width="1.5" fill="none" opacity="0.6"/>
    <path d="M542,100 L550,90 L558,100 L550,110 Z" stroke="#10b981" stroke-width="1.5" fill="none" opacity="0.6"/>
    <text x="550" y="150" text-anchor="middle" fill="#10b981" font-size="10" opacity="0.8">CREATE</text>
    <!-- Guide -->
    <circle cx="750" cy="100" r="24" stroke="#10b981" stroke-width="1.5" fill="none" opacity="0.6"/>
    <path d="M742,108 L750,88 L758,108" stroke="#10b981" stroke-width="1.5" fill="none" opacity="0.6"/>
    <line x1="750" y1="88" x2="750" y2="108" stroke="#10b981" stroke-width="1.5" opacity="0.6"/>
    <text x="750" y="150" text-anchor="middle" fill="#10b981" font-size="10" opacity="0.8">GUIDE</text>
    <!-- Execute -->
    <circle cx="950" cy="100" r="24" stroke="#10b981" stroke-width="1.5" fill="none" opacity="0.6"/>
    <path d="M940,100 L960,100 M950,90 L950,110" stroke="#10b981" stroke-width="2" opacity="0.6"/>
    <text x="950" y="150" text-anchor="middle" fill="#10b981" font-size="10" opacity="0.8">EXECUTE</text>
    <!-- Verify -->
    <circle cx="1100" cy="100" r="24" stroke="#10b981" stroke-width="2" fill="#10b981" fill-opacity="0.15"/>
    <path d="M1090,100 L1097,108 L1112,92" stroke="#10b981" stroke-width="2.5" fill="none"/>
    <text x="1100" y="150" text-anchor="middle" fill="#10b981" font-size="10" opacity="0.9">VERIFY</text>
  </g>
  <!-- Arrows between steps -->
  <g stroke="#10b981" stroke-width="1" opacity="0.3">
    <path d="M180,100 L320,100" marker-end="url(#arrow)"/>
    <path d="M380,100 L520,100"/>
    <path d="M580,100 L720,100"/>
    <path d="M780,100 L920,100"/>
    <path d="M980,100 L1070,100"/>
  </g>
</svg>