<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" fill="none">
  <rect width="800" height="350" fill="#0A0A0F"/>
  <!-- Standard Camera - Left -->
  <g transform="translate(50, 30)">
    <text x="150" y="0" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold" opacity="0.5">STANDARD CAMERA</text>
    <!-- Camera body -->
    <rect x="90" y="30" width="120" height="80" rx="4" stroke="#ffffff" stroke-width="1" fill="none" opacity="0.3"/>
    <circle cx="150" cy="70" r="25" stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.4"/>
    <circle cx="150" cy="70" r="10" fill="#ffffff" fill-opacity="0.1"/>
    <!-- 2D output -->
    <rect x="80" y="140" width="140" height="100" rx="2" stroke="#ffffff" stroke-width="0.5" fill="none" opacity="0.2"/>
    <text x="150" y="165" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="9" opacity="0.4">2D PIXELS</text>
    <text x="150" y="180" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="8" opacity="0.3">(u, v)</text>
    <text x="150" y="200" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="8" opacity="0.3">NO DEPTH</text>
    <text x="150" y="215" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="8" opacity="0.3">FLAT IMAGE</text>
    <!-- Limitations -->
    <text x="150" y="270" text-anchor="middle" fill="#ef4444" font-family="monospace" font-size="9" font-weight="bold" opacity="0.6">LIMITED UNDERSTANDING</text>
    <text x="150" y="290" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="8" opacity="0.3">Cannot measure distance</text>
    <text x="150" y="305" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="8" opacity="0.3">Cannot track 3D pose</text>
  </g>
  <!-- VS -->
  <text x="400" y="180" text-anchor="middle" fill="#10b981" font-family="monospace" font-size="14" font-weight="bold" opacity="0.4">VS</text>
  <!-- Spatial/Depth Camera - Right -->
  <g transform="translate(420, 30)">
    <text x="170" y="0" text-anchor="middle" fill="#10b981" font-family="monospace" font-size="11" font-weight="bold" opacity="0.8">SPATIAL / DEPTH</text>
    <!-- Camera body -->
    <rect x="110" y="30" width="120" height="80" rx="4" stroke="#10b981" stroke-width="1.5" fill="none" opacity="0.5"/>
    <circle cx="150" cy="60" r="15" stroke="#10b981" stroke-width="1" fill="none" opacity="0.4"/>
    <circle cx="190" cy="60" r="8" stroke="#10b981" stroke-width="1" fill="none" opacity="0.3"/>
    <!-- Depth waves -->
    <path d="M130,100 Q150,115 170,100" stroke="#10b981" stroke-width="0.5" fill="none" opacity="0.3"/>
    <path d="M120,108 Q150,128 180,108" stroke="#10b981" stroke-width="0.5" fill="none" opacity="0.2"/>
    <!-- 3D output -->
    <rect x="100" y="140" width="160" height="100" rx="2" stroke="#10b981" stroke-width="0.5" fill="#10b981" fill-opacity="0.03"/>
    <text x="180" y="165" text-anchor="middle" fill="#10b981" font-family="monospace" font-size="9" opacity="0.7">3D METRIC POINTS</text>
    <text x="180" y="180" text-anchor="middle" fill="#10b981" font-family="monospace" font-size="8" opacity="0.5">(X, Y, Z) metres</text>
    <text x="180" y="200" text-anchor="middle" fill="#10b981" font-family="monospace" font-size="8" opacity="0.5">HAND SKELETON</text>
    <text x="180" y="215" text-anchor="middle" fill="#10b981" font-family="monospace" font-size="8" opacity="0.5">WORLD COORDINATES</text>
    <!-- Capabilities -->
    <text x="180" y="270" text-anchor="middle" fill="#10b981" font-family="monospace" font-size="9" font-weight="bold" opacity="0.8">FULL SPATIAL UNDERSTANDING</text>
    <text x="180" y="290" text-anchor="middle" fill="#10b981" font-family="monospace" font-size="8" opacity="0.5">Measures real distances</text>
    <text x="180" y="305" text-anchor="middle" fill="#10b981" font-family="monospace" font-size="8" opacity="0.5">Tracks 3D hand pose</text>
    <text x="180" y="320" text-anchor="middle" fill="#10b981" font-family="monospace" font-size="8" opacity="0.5">LiDAR / ToF / Stereo</text>
  </g>
</svg>